<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5fb" />
    <title>聊天</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="chat-card">
      <header class="topbar">
        <div class="topbar-left">
          <span class="chat-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="connection-state"><span class="connection-dot" id="connectionDot"></span><span id="connectionLabel">连接中</span></span>
        </div>
        <div class="topbar-right">
          <div class="theme-picker">
            <button class="icon-button" id="themeButton" aria-label="切换样式" aria-expanded="false">◐</button>
            <div class="theme-menu hidden" id="themeMenu">
              <button class="theme-option" data-theme-choice="light"><span class="theme-swatch swatch-light"></span><span>清透</span></button>
              <button class="theme-option" data-theme-choice="dark"><span class="theme-swatch swatch-dark"></span><span>夜墨</span></button>
              <button class="theme-option" data-theme-choice="cream"><span class="theme-swatch swatch-cream"></span><span>纸张</span></button>
              <button class="theme-option" data-theme-choice="mint"><span class="theme-swatch swatch-mint"></span><span>薄荷</span></button>
              <button class="theme-option" data-theme-choice="ocean"><span class="theme-swatch swatch-ocean"></span><span>海盐</span></button>
              <button class="theme-option" data-theme-choice="rose"><span class="theme-swatch swatch-rose"></span><span>玫瑰</span></button>
              <button class="theme-option" data-theme-choice="sunset"><span class="theme-swatch swatch-sunset"></span><span>落日</span></button>
              <button class="theme-option" data-theme-choice="mono"><span class="theme-swatch swatch-mono"></span><span>黑白</span></button>
              <button class="theme-option" data-theme-choice="lavender"><span class="theme-swatch swatch-lavender"></span><span>薰衣草</span></button>
            </div>
          </div>
          <button class="profile-button" id="profileButton" aria-label="修改昵称">
            <span class="avatar avatar-me" id="myAvatar">访客</span>
            <span id="myNickname">访客</span>
          </button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <section class="composer-wrap">
        <div class="drop-hint" id="dropHint">松开即可发送</div>
        <div class="attachment-preview hidden" id="attachmentPreview"></div>
        <div class="composer">
          <button class="attach-button" id="attachButton" title="发送图片或文件">＋</button>
          <input type="file" id="fileInput" hidden />
          <textarea id="messageInput" rows="1" placeholder="输入消息…"></textarea>
          <button class="send-button" id="sendButton" aria-label="发送">↗</button>
        </div>
      </section>
    </main>

    <div class="modal-backdrop hidden" id="nicknameModal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="nicknameTitle">
        <button class="modal-close" id="closeModalButton" aria-label="关闭">×</button>
        <div class="avatar modal-avatar avatar-me" id="modalAvatar">访客</div>
        <h2 id="nicknameTitle">修改昵称</h2>
        <p class="device-label" id="deviceLabel">设备 ID · 加载中</p>
        <input class="nickname-input" id="nicknameInput" maxlength="24" autocomplete="off" />
        <button class="save-button" id="saveNicknameButton">保存</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
